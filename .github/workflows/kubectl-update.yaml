---
name: Update sysdig/sysdig-kubectl image reference for Helm tests

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  pull-requests: write

jobs:
  kubectl-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@8aa7bec31d6463e47c947f06c6b1df7dba276e07 # v3.11.0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SYSDIGLABS_GHA_APP_ID }}
          private-key: ${{ secrets.SYSDIGLABS_GHA_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run Updatecli
        run: "updatecli apply --config .github/updatecli.d/config-update-kubectl-image.yaml"
        env:
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"
