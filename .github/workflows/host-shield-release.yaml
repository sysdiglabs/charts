---
name: Update charts for Host Shield release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Host Shield Version'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  host-shield-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@93ae2608256484ef8598e902aa675bbc9e278e4e # v3.10.0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYSDIGLABS_GHA_APP_ID }}
          private-key: ${{ secrets.SYSDIGLABS_GHA_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run Updatecli in apply mode
        run: "updatecli apply --config .github/updatecli.d/config-host-shield-windows-release.yaml"
        env:
          HOST_SHIELD_RELEASE: "${{ inputs.release }}"
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"
