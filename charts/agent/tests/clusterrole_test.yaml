suite: Agent Cluster Role Tests
templates:
  - templates/clusterrole.yaml
tests:
  - it: Test PSP information included in k8s <1.25
    capabilities:
      majorVersion: 1
      minorVersion: 24
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - "policy"
            resources:
              - "podsecuritypolicies"
            resourceNames:
              - RELEASE-NAME-agent
            verbs:
              - "use"

  - it: Test PSP information not included in k8s >=1.25
    capabilities:
      majorVersion: 1
      minorVersion: 25
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - "policy"
            resources:
              - "podsecuritypolicies"
            resourceNames:
              - RELEASE-NAME-agent
            verbs:
              - "use"

  - it: Test PSP information included in k8s <1.25 with '+' character in minor version
    capabilities:
      majorVersion: 1
      minorVersion: "24+"
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - "policy"
            resources:
              - "podsecuritypolicies"
            resourceNames:
              - RELEASE-NAME-agent
            verbs:
              - "use"

  - it: Test PSP information not included in k8s >=1.25 with '+' character in minor version
    capabilities:
      majorVersion: 1
      minorVersion: "25+"
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - "policy"
            resources:
              - "podsecuritypolicies"
            resourceNames:
              - RELEASE-NAME-agent
            verbs:
              - "use"

  - it: Test Events can be created in kubernetes
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - "events"
            verbs:
              - "create"
              - "patch"

  - it: SMAGENT-6299 - Test agent can read configmaps in kubernetes to publish the "kube_configmap_info" metric
    asserts:
      - contains:
          path: rules[0].resources
          content: configmaps

  - it: Default values grant nodes/logs
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/log
            verbs:
              - get

  - it: On a host shield < 14.8.0 grants nodes/proxy only
    set:
      image:
        tag: 14.7.4
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/proxy
            verbs:
              - get
              - list
              - watch
      - lengthEqual:
          path: rules
          count: 12

  - it: on host shield 14.8.0+ grants nodes/log only
    set:
      image:
        tag: 14.8.0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/log
            verbs:
              - get

  - it: on host shield 14.8.0+ grants nodes/log only
    set:
      image:
        tag: 14.9.0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/log
            verbs:
              - get

  - it: on host shield without semver grants nodes/log only
    set:
      image:
        tag: test-tag
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/log
            verbs:
              - get
