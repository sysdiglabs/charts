# Artifact Hub repository metadata file
#
# This file lets us claim ownership of the Sysdig Helm repository on Artifact Hub.
# For a Helm repository, Artifact Hub fetches it from the root of the repository
# URL, i.e. https://charts.sysdig.com/artifacthub-repo.yml
#
# It is published to the gh-pages branch root by the "Release Charts" workflow
# (.github/workflows/release.yaml).
#
# Docs: https://artifacthub.io/docs/topics/repositories/

# repositoryID is generated by Artifact Hub when the repository is first added
# (Control Panel -> Repositories -> the repo's ID). It must match exactly for
# the ownership claim to be verified.
repositoryID: 94e1d322-396c-49be-b717-94384b2ec586

# Set to true to opt out of receiving security scanning of the repo's packages.
# scanner:
#   disabled: false

# owners must match registered Artifact Hub user accounts (email is used for
# verification). This information is publicly visible.
owners:
  - name: Marco Vito Moscaritolo
    email: mavimo@gmail.com

ignore: # (optional, packages that should not be indexed by Artifact Hub)
  - name: cloud-bench
  - name: cloud-scanning
  - name: cluster-scanner
  - name: common
  - name: harbor-scanner-sysdig-secure
  - name: sysdig-mcm-navmenu
  - name: sysdig-stackdriver-bridge
